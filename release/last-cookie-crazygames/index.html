:root{--ink:#4a2612;--cream:#fff6e6;--choc:#5a2e16;--gold:#f2b44a;--pink:#ff7fa8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none;-webkit-touch-callout:none}
#card,.card2{touch-action:pan-y}
html,body{margin:0;height:100%;overflow:hidden;background:#f3d9b6;font-family:'LC Display','Arial Rounded MT Bold','Nunito',system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
[hidden]{display:none!important}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 48%,rgba(0,0,0,0) 55%,rgba(120,70,30,.22) 100%)}
.out{color:#fff;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 4px 0 rgba(74,38,18,.35)}
#top{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;pointer-events:none;z-index:5}
.pill{background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:4px 14px 5px;font-size:20px;box-shadow:0 4px 0 rgba(74,38,18,.35);white-space:nowrap}
#timeP.hot{background:#ff6b5a;color:#fff}
#prog{position:relative;width:min(46vw,300px);height:34px;background:var(--cream);border:3px solid var(--ink);border-radius:999px;box-shadow:0 4px 0 rgba(74,38,18,.35);overflow:hidden}
#progFill{position:absolute;inset:0;background:var(--gold);transform-origin:0 50%;transform:scaleX(0);will-change:transform}
#prog.mine #progFill{background:#7be07b}
#progTxt{position:absolute;inset:0;display:grid;place-items:center;font-size:19px}
#board{position:fixed;top:max(62px,calc(env(safe-area-inset-top) + 54px));right:12px;display:flex;flex-direction:column;gap:3px;pointer-events:none;z-index:5;font-size:14px}
#board div{display:flex;align-items:center;gap:6px;background:rgba(255,246,230,.9);border:2px solid var(--ink);border-radius:10px;padding:2px 8px;min-width:150px}
#board div.me{background:#ffe5a8}
#board div.has{border-color:#e0791b;box-shadow:0 0 0 2px #ffc93c}
#board span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80px}
#board u{width:44px;height:8px;border:2px solid var(--ink);border-radius:6px;background:#fff;overflow:hidden;text-decoration:none}
#board em{display:block;height:100%;background:var(--gold)}
#board .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);flex:none}
#ptr{position:fixed;left:0;top:0;will-change:transform;z-index:5;pointer-events:none;font-size:26px;width:46px;height:46px;display:grid;place-items:center;background:var(--cream);border:3px solid var(--ink);border-radius:50%;box-shadow:0 4px 0 rgba(74,38,18,.35)}
#ptrA{position:absolute;left:50%;top:50%;width:0;height:0;margin:-9px 0 0 -6px;border:9px solid transparent;border-left:13px solid #e0791b;transform-origin:6px 9px}
#feed{position:fixed;top:max(180px,calc(env(safe-area-inset-top) + 172px));right:12px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;pointer-events:none;z-index:5}
#feed div{background:rgba(255,246,230,.92);border:2px solid var(--ink);border-radius:10px;padding:2px 9px;font-size:14px;animation:fin .25s ease-out}
@keyframes fin{from{transform:translateX(30px);opacity:0}}
#banner{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);text-align:center;font-size:clamp(20px,3.2vw,32px);max-width:min(92vw,720px);pointer-events:none;z-index:6;line-height:1.15}
#banner.big{font-size:clamp(56px,10vw,110px)}
#banner.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.4);opacity:0}}
#tip{position:fixed;left:50%;bottom:max(90px,calc(env(safe-area-inset-bottom) + 84px));transform:translateX(-50%);background:var(--cream);border:3px solid var(--ink);border-radius:16px;padding:8px 16px 9px;font-size:clamp(17px,2.3vw,24px);max-width:min(90vw,700px);text-align:center;box-shadow:0 5px 0 rgba(74,38,18,.35);pointer-events:none;z-index:6;transition:opacity .3s}
#intro{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:10px;z-index:6;pointer-events:none;transition:opacity .4s}
#intro div{background:var(--cream);border:3px solid var(--ink);border-radius:16px;width:150px;padding:6px 8px 8px;text-align:center;font-size:15px;box-shadow:0 6px 0 rgba(74,38,18,.35);animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
#intro div:nth-child(2){animation-delay:.15s}#intro div:nth-child(3){animation-delay:.3s}
#intro b{display:block;font-size:30px;font-weight:normal;line-height:1.2}
#intro i{display:block;font-style:normal;font-size:13px;opacity:.7;margin-top:4px}
#chipBox{position:fixed;left:14px;bottom:max(14px,calc(env(safe-area-inset-bottom) + 10px));display:flex;align-items:center;gap:8px;pointer-events:none;z-index:5}
#chipIco{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a8673d 0 12%,#4a2312 40%,#2c1308 75%);border:3px solid var(--ink);box-shadow:0 4px 0 rgba(74,38,18,.35);display:grid;place-items:center;font-size:22px;color:#fff}
#chipTxt{font-size:15px;line-height:1.1}
#pips{display:flex;gap:4px;margin-top:3px}
#pips i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:#f6e3c6}
#pips i.on{background:var(--gold)}
#keys{position:fixed;right:14px;bottom:14px;font-size:14px;text-align:right;line-height:1.5;pointer-events:none;z-index:5;opacity:.9}
#keys span{background:rgba(255,246,230,.85);border:2px solid var(--ink);border-radius:8px;padding:1px 8px}
.btn{font-family:inherit;border:3px solid var(--ink);border-radius:18px;background:var(--gold);color:var(--ink);font-size:22px;padding:10px 26px 12px;box-shadow:0 5px 0 var(--ink);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn.sec{background:var(--cream)}
#touch{position:fixed;inset:0;z-index:4;pointer-events:none}
#touch .tb{position:absolute;pointer-events:auto;border-radius:50%;border:4px solid var(--ink);display:grid;place-items:center;font-size:18px;color:#fff;box-shadow:0 5px 0 rgba(74,38,18,.45)}
#tbDash{width:96px;height:96px;right:max(22px,env(safe-area-inset-right));bottom:max(28px,calc(env(safe-area-inset-bottom) + 18px));background:radial-gradient(circle at 40% 30%,#ff9cbd,#ef4f86)}
#touch .tb.cd{filter:grayscale(.6) brightness(.85)}
#touch .tb svg{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);transform:rotate(-90deg);pointer-events:none}
#stick{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:rgba(255,246,230,.35);border:3px solid rgba(74,38,18,.5);pointer-events:none}
#stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--cream);border:3px solid var(--ink)}
#tbJump{width:74px;height:74px;right:calc(max(22px,env(safe-area-inset-right)) + 106px);bottom:max(36px,calc(env(safe-area-inset-bottom) + 26px));background:radial-gradient(circle at 40% 30%,#9fe0ff,#3d9be0)}
body.lefty #tbJump{right:auto;left:calc(max(22px,env(safe-area-inset-left)) + 106px)}
body.lefty #tbDash{right:auto;left:max(22px,env(safe-area-inset-left))}
body.lefty #chipBox{left:auto;right:14px}
#tags{position:fixed;inset:0;pointer-events:none;z-index:3}

<script type="module">
const THREE = await import('./three.module.min.js');
// ===== SIM START（纯逻辑，可在 node 里跑） =====
// 玩法 v3「抢饼干」：大桌面上只有一块饼干，抱着它跑，累计抱满 WIN_T 秒（吃完）就赢。
const SIM = (() => {
  const CFG = {
    HW: 26, HH: 18,       // 长方桌：半宽 / 半深（米）
    ROUND_R: 20,          // 圆桌半径（小一些，边更近，更容易被撞下去）
    N: 8,                 // 人数（你 + 7 个机器人）
    SPEED: 6.2, ACCEL: 60, KFRIC: 5.5, BODY_R: 0.5,
    // ——以下规则对所有人一视同仁（以后全是真人联机也成立），不再给“真人”开小灶——
    CARRY_SLOW: 0.93,      // 抱着饼干跑得慢一些：追的人迟早追得上
    GRAB_BOOST: 1.35, GRAB_T: 2.0, // 刚抢到：加速冲出人堆
    ROBBED_CD: 2.0,       // 刚被抢：这么久不能冲撞（不能立刻抢回来，避免来回倒手）
    CHASE_DASH: 1.2,      // 追抱饼干的人时冲得更远
    PAD: 0.25,            // 冲向抱饼干的人时判定放宽
    HOME_TURN: 5,         // 冲撞途中跟着目标拐弯的速度（弧度/秒）；急转或跳起来仍然躲得开
    WIN_T: 24,            // 累计抱满这么多秒就赢
    MAX_T: 180,           // 只是保险：正常都是有人先吃完；真拖到这时谁吃得多谁赢（界面最后 20 秒才显示倒计时）
    COUNT_T: 3,
    // 冲撞
    DASH_T: 0.22, DASH_SPEED: 15, DASH_CD: 1.2, DASH_K: 9, STUN_T: 0.35,
    JUMP_T: 0.55, JUMP_CD: 2.2, // 跳：空中撞不到你；2 级起落地震开一圈人
    DASH_BUF: 0.3,        // 冷却快好时提前按也算数
    AIM_R: 5, AIM_ANG: 1.6,   // 冲撞自动对准抱饼干的人（距离、夹角）——所有人都一样
    GUARD_T: 2.5,         // 刚抢到饼干的保护时间
    STEAL_CD: 0.25,       // 抢到后冲撞马上又能用（好甩开人）
    PICK_R: 1.0,
    RESPAWN_T: 2.0, INV_T: 1.2,
    // 巧克力豆：吃了变大
    CHIP_N: 64, CHIP_R: 0.8, CHIP_RESPAWN: 0.25,
    LVL_AT: [0, 4, 10, 18],
    // 升级解锁的招：1 级冲得更远，2 级冲撞落地震开一圈人，3 级抱饼干时护盾挡一次
    DASH_LONG: 1.4, WAVE_R: 2.8, WAVE_K: 7.5, SHIELD_CD: 12,
    // 桌上的道具：辣椒（加速）、冰块（冻住附近的人）、泡泡（挡一次撞）
    ITEM_N: 4, ITEM_T: 4, BOOST_T: 4, BOOST: 1.38, FREEZE_R: 8, FREEZE_T: 1.6, BUBBLE_T: 12,
    // 果酱：踩上去变慢
    PUDDLE_N: 5, PUDDLE_R: 2.1, PUDDLE_SLOW: 0.55,
    SCALE: [1, 1.18, 1.36, 1.55],
    POWER: [1, 1.2, 1.4, 1.6],     // 撞人力度
    MASS: [1, 1.25, 1.55, 1.9],    // 抗撞
    SLOW: [1, 0.985, 0.97, 0.955],
    // 机器人
    CHASERS: 4,           // 同时追饼干的机器人数量
    BOT_RATE: 4,          // 机器人够得着时每秒出手的概率（越小越不爱撞）
    BOT_REACT: 0.35,      // 机器人出手前的反应时间
  };

  function rng(seed) {
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }

  // ---- 桌上的障碍：杯子、碗、果酱瓶（圆）；牛奶盒、书、麦片盒（方） ----
  const KINDS = { mug: { r: 1.5 }, bowl: { r: 2.5 }, jar: { r: 1.15 }, carton: { w: 2.2, d: 2.2 }, books: { w: 5, d: 3.4 }, cereal: { w: 6, d: 2.2 } };
  // 离桌边还有多远（负数 = 已经出桌）
  function edgeGap(S, x, z) { return S.round ? CFG.ROUND_R - Math.hypot(x, z) : Math.min(CFG.HW - Math.abs(x), CFG.HH - Math.abs(z)); }
  function pullIn(S, x, z, m) {
    if (S.round) { const d = Math.hypot(x, z), R = CFG.ROUND_R - m; return d > R ? [x / d * R, z / d * R] : [x, z]; }
    return [Math.max(-CFG.HW + m, Math.min(CFG.HW - m, x)), Math.max(-CFG.HH + m, Math.min(CFG.HH - m, z))];
  }
  function makeObstacles(r, round) {
    const obs = [], want = round ? ['bowl', 'books', 'cereal', 'mug', 'mug', 'mug', 'carton', 'carton', 'jar', 'jar', 'jar'] : ['bowl', 'bowl', 'books', 'books', 'cereal', 'cereal', 'mug', 'mug', 'mug', 'mug', 'carton', 'carton', 'carton', 'jar', 'jar', 'jar', 'jar'];
    for (const kind of want) {
      const K = KINDS[kind];
      for (let t = 0; t < 80; t++) {
        let w = K.w, d = K.d; if (w && r() < 0.5) { const s = w; w = d; d = s; }
        const br = K.r || Math.hypot(w, d) / 2, ex = K.r || w / 2, ez = K.r || d / 2;
        const x = (r() * 2 - 1) * ((round ? CFG.ROUND_R : CFG.HW) - 2.6 - ex), z = (r() * 2 - 1) * ((round ? CFG.ROUND_R : CFG.HH) - 2.6 - ez);
        if (round && Math.hypot(x, z) + br > CFG.ROUND_R - 2.6) continue;
        if (Math.hypot(x, z) < br + 5.5) continue;
        if (obs.some(o => Math.hypot(o.x - x, o.z - z) < o.br + br + 2.6)) continue;
        obs.push({ id: obs.length, kind, x, z, r: K.r || 0, hw: w / 2 || 0, hd: d / 2 || 0, br, rot: r() * 6.283, tint: (r() * 6) | 0 });
        break;
      }
    }
    return obs;
  }
  // 把圆 (x,z,rad) 推出障碍；返回 [x, z, 碰到了吗]
  function pushOut(obs, x, z, rad) {
    let hit = false;
    for (const o of obs) {
      const dx = x - o.x, dz = z - o.z;
      if (o.r) {
        const d = Math.hypot(dx, dz), m = o.r + rad;
        if (d < m) { const k = d > 1e-4 ? m / d : 1; x = o.x + (d > 1e-4 ? dx * k : m); z = o.z + dz * k; hit = true; }
      } else {
        if (Math.abs(dx) > o.hw + rad || Math.abs(dz) > o.hd + rad) continue;
        const cx = Math.max(-o.hw, Math.min(o.hw, dx)), cz = Math.max(-o.hd, Math.min(o.hd, dz));
        const ex = dx - cx, ez = dz - cz, d = Math.hypot(ex, ez);
        if (d > 1e-4) { if (d < rad) { x = o.x + cx + ex / d * rad; z = o.z + cz + ez / d * rad; hit = true; } }
        else { // 圆心在盒子里：从最近的一边出去
          const px = o.hw - Math.abs(dx), pz = o.hd - Math.abs(dz);
          if (px < pz) x = o.x + Math.sign(dx || 1) * (o.hw + rad); else z = o.z + Math.sign(dz || 1) * (o.hd + rad);
          hit = true;
        }
      }
    }
    return [x, z, hit];
  }
  function blocked(S, x, z, rad, edge = 0.6) {
    if (edgeGap(S, x, z) < edge) return true;
    for (const o of S.obs) {
      const dx = x - o.x, dz = z - o.z;
      if (o.r) { if (dx * dx + dz * dz < (o.r + rad) * (o.r + rad)) return true; }
      else if (Math.abs(dx) < o.hw + rad && Math.abs(dz) < o.hd + rad) return true;
    }
    return false;
  }
  function freeSpot(S, pred) {
    for (let t = 0; t < 200; t++) {
      const x = (S.rnd() * 2 - 1) * ((S.round ? CFG.ROUND_R : CFG.HW) - 2), z = (S.rnd() * 2 - 1) * ((S.round ? CFG.ROUND_R : CFG.HH) - 2);
      if (blocked(S, x, z, 0.9)) continue;
      if (pred && t < 150 && !pred(x, z)) continue;
      return [x, z];
    }
    return [0, 0];
  }

  function create(opts = {}) {
    const seed = opts.seed ?? ((Math.random() * 1e9) | 0);
    const n = opts.players ?? CFG.N;
    const R = rng(seed ^ 0x5bd1e995);
    const S = { cfg: CFG, round: !!opts.round, obs: makeObstacles(rng(seed), !!opts.round), players: [], chips: [], chipId: 0, chipT: 0, items: [], itemId: 0, itemT: 2, puddles: [], t: 0, playT: 0, phase: 'count', phaseT: CFG.COUNT_T, events: [], winner: -1, rnd: R, seed,
      cookie: { x: 0, z: 0, holder: -1, cd: 0, no: -1, noT: 0, munch: 0 } };
    for (let i = 0; i < n; i++) {
      const a = Math.PI / 2 + i / n * Math.PI * 2;
      let x = Math.cos(a) * 11, z = Math.sin(a) * 8.5;
      [x, z] = pushOut(S.obs, x, z, 0.9);
      S.players.push({
        id: i, bot: true, human: false, name: '', look: i, x, z, face: Math.atan2(-x, -z),
        mvx: 0, mvz: 0, kvx: 0, kvz: 0, chips: 0, lvl: 0, on: true, fallT: 0, fx: 0, fz: 0, fvx: 0, fvz: 0,
        inv: 0, guard: 0, dashCd: 0.4, dashT: 0, dashX: 0, dashZ: 0, dashHit: false, hitT: 0, lastHit: -1, lastHitT: 0,
        shieldCd: 0, boostT: 0, frozenT: 0, bubbleT: 0, wave: false, eaten: 0, steals: 0, shoves: 0, falls: 0, place: 0,
        home: -1, grabT: 0, jumpT: 0, jumpCd: 0, jumpBuf: 0, inp: { mx: 0, mz: 0, dash: false, jump: false }, ai: { t: 0, mx: 0, mz: 0, side: 1, sideT: 0, chip: null, react: 0 },
      });
    }
    for (let i = 0; i < CFG.PUDDLE_N; i++) { const [x, z] = freeSpot(S, (x, z) => Math.hypot(x, z) > 7 && edgeGap(S, x, z) > 4 && S.puddles.every(c => Math.hypot(c.x - x, c.z - z) > 9)); S.puddles.push({ id: i, x, z, r: CFG.PUDDLE_R * (0.8 + S.rnd() * 0.4) }); }
    for (let i = 0; i < CFG.CHIP_N; i++) addChip(S);
    return S;
  }
  function addChip(S) {
    const [x, z] = freeSpot(S, (x, z) => Math.hypot(x, z) > 3 && S.chips.every(c => Math.hypot(c.x - x, c.z - z) > 1.8));
    S.chips.push({ id: S.chipId++, x, z });
  }
  function lvlOf(chips) { let l = 0; for (let i = 0; i < CFG.LVL_AT.length; i++) if (chips >= CFG.LVL_AT[i]) l = i; return l; }
  function ev(S, e) { S.events.push(e); }

  function fall(S, p) {
    p.on = false; p.fallT = 0; p.falls++; p.fx = p.x; p.fz = p.z; p.fvx = p.kvx + p.mvx; p.fvz = p.kvz + p.mvz; p.dashT = 0;
    p.chips = Math.floor(p.chips / 2); p.lvl = lvlOf(p.chips);
    const by = (p.lastHit >= 0 && S.t - p.lastHitT < 3) ? p.lastHit : -1;
    if (by >= 0) S.players[by].shoves++;
    ev(S, { k: 'fall', p: p.id, by, x: p.x, z: p.z });
    const ck = S.cookie;
    if (ck.holder === p.id) { // 饼干留在桌边

// 平台包装（CrazyGames / Poki 版用；GitHub 测试版用 client.js 里的空实现）。build.py 会把它换进 client.js。
// 写法照搬 burnt-again 里验证过的那份：每个调用都包一层，SDK 没加载、被广告拦截器挡了也照样能玩。
const PF = (() => {
  const safe = fn => { try { return fn(); } catch (e) { return undefined; } };
  let cg = null, poki = null, playing = false, hostMuted = false, adMuted = false, loc = '';
  // CrazyGames 会忽略 1 秒内连发的开始/停止，所以只把最后的状态发出去
  let cgSent = false, cgLast = -1e9, cgTimer = 0;
  function cgSync() {
    cgTimer = 0;
    if (!cg || cgSent === playing) return;
    const wait = cgLast + 1100 - Date.now();
    if (wait > 0) { cgTimer = setTimeout(cgSync, wait); return; }
    cgSent = playing; cgLast = Date.now();
    safe(() => (playing ? cg.game.gameplayStart() : cg.game.gameplayStop()));
  }
  const api = {
    adBusy: false, noEsc: true,                 // Esc 被平台占用（退出全屏），暂停只用 P
    get muted() { return hostMuted || adMuted; },
    locale: () => loc,
    async init() {
      // 等页面加载完再初始化，否则 CrazyGames SDK 会卡住
      if (document.readyState === 'loading') await new Promise(r => addEventListener('DOMContentLoaded', r, { once: true }));
      if (window.PokiSDK) {
        poki = window.PokiSDK;
        try { await poki.init(); } catch (e) { }
        loc = String(safe(() => poki.getLanguage && poki.getLanguage()) || '').slice(0, 2).toLowerCase();
        return;
      }
      const s = window.CrazyGames && window.CrazyGames.SDK; if (!s) return;
      try { await s.init(); } catch (e) { return; }
      if (safe(() => s.environment) === 'disabled') return;
      cg = s; safe(() => s.game.loadingStart());
      const info = safe(() => s.user.systemInfo) || {};
      loc = String(info.locale || '').slice(0, 2).toLowerCase();
      const apply = st => { hostMuted = !!(st && st.muteAudio); };
      apply(safe(() => s.game.settings)); safe(() => s.game.addSettingsChangeListener(apply));
    },
    loadingDone() { if (poki) safe(() => poki.gameLoadingFinished()); if (cg) safe(() => cg.game.loadingStop()); if (playing) cgSync(); },
    // focusLost：切走窗口导致的暂停。CrazyGames 自己会管，要求游戏别为这个发“停止”
    setPlaying(b, focusLost) {
      b = !!b; if (b === playing) return;
      if (!b && cg && focusLost) return;
      playing = b;
      if (poki) safe(() => (b ? poki.gameplayStart() : poki.gameplayStop()));
      else if (cg && !cgTimer) cgSync();
    },
    happy() { if (cg) safe(() => cg.game.happytime()); },
    // 两局之间的广告。放不放由平台决定；不管怎样最后都会调 cb，不会把人卡住
    midgame(cb) {
      let finished = false, started = false;
      const block = document.getElementById('adblock');
      const done = () => { if (finished) return; finished = true; api.adBusy = false; adMuted = false; block.hidden = true; cb && cb(); };
      if (!poki && !cg) return done();
      api.adBusy = true; block.hidden = false;
      const onStart = () => { started = true; adMuted = true; };   // 只在广告真的开始时静音
      if (poki) { try { Promise.resolve(poki.commercialBreak(onStart)).then(done, done); } catch (e) { done(); } return; }
      setTimeout(() => { if (!started) done(); }, 6000);
      try {
        const p = cg.ad.requestAd('midgame', { adStarted: onStart, adFinished: done, adError: done });
        if (p && typeof p.catch === 'function') p.catch(done);
      } catch (e) { done(); }
    },
  };
  return api;
})();

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function hash2(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);

}

      a.ice.visible = p.frozenT > 0;
      const sh = p.lvl >= 3 && p.shieldCd <= 0 && i === holder; a.bub.visible = p.bubbleT > 0 || sh; if (a.bub.visible) { a.bub.material = p.bubbleT > 0 ? bubMat : shieldMat; a.bub.scale.setScalar(1 + 0.04 * Math.sin(now * 6 + i)); }
      if ((p.boostT > 0 || p.grabT > 0) && Math.random() < 0.6) emit(stars, p.x + (Math.random() - 0.5) * 0.5, 0.3, p.z + (Math.random() - 0.5) * 0.5, 0, 1.5, 0, 0.35, 0.8, 0.2);
      a.root.visible = !(p.inv > 0 && a.drop <= 0 && Math.sin(now * 30) > 0.3);
    } else { // 掉下桌：往外飞着掉下去
      const t = p.fallT;
      a.root.visible = t < 1.3;
      a.root.position.set(p.fx + p.fvx * 0.25 * Math.min(t, 0.8), -t * t * 9, p.fz + p.fvz * 0.25 * Math.min(t, 0.8));
      a.root.rotation.x = t * 4; sn.blob.material.opacity = 0;
    }
    // 名字（抱饼干的人多显示一个饼干）
    const tag = a.tag, txt = nameTxt(p) + (i === holder ? ' 🍪' : '');
    if (txt !== a.tagTxt) { a.tagTxt = txt; tag.textContent = txt; }
    const [sx, sy, vis] = toScreen(a.root.position.x, a.root.position.y + (i === holder ? 1.75 : 1.05) * a.scale * VIS, a.root.position.z);
    const show = vis && p.on && !(inLobby && i !== ME); if (a.tagShow !== show) { a.tagShow = show; tag.style.display = show ? '' : 'none'; }
    if (show) setTf(tag, `translate3d(${Math.round(sx)}px,${Math.round(sy)}px,0) translate(-50%,-100%)`);
  }
  // 饼干
  const ck = S.cookie;
  if (holder >= 0) {
    const p = S.players[holder], a = actors[holder];
    cookieObj.position.set(a.root.position.x, a.root.position.y + 1.22 * a.scale * VIS + Math.sin(now * 9) * 0.05, a.root.position.z);
    cookieObj.rotation.set(0.35, now * 2.5, 0); cookieObj.scale.setScalar(1.25 - 0.45 * p.eaten / C.WIN_T);
    beam.visible = false; ckRing.visible = true; ckRing.position.set(p.x, 0.03, p.z); ckRing.scale.setScalar(a.scale * (0.95 + 0.06 * Math.sin(now * 8)));
    ckRing.material.color.set(p.guard > 0 && holder !== ME ? 0x7fd4ff : holder === ME ? 0x6fe36f : 0xffc93c); // 蓝圈 = 刚抢到，保护中，抢不走
  } else {
    cookieObj.position.set(ck.x, 0.75 + Math.sin(now * 3) * 0.15, ck.z); cookieObj.rotation.set(0.5, now * 2, 0); cookieObj.scale.setScalar(1.5);
    beam.visible = true; beam.position.set(ck.x, 4.5, ck.z); beam.material.opacity = 0.22 + 0.1 * Math.sin(now * 5);
    ckRing.visible = true; ckRing.position.set(ck.x, 0.03, ck.z); ckRing.scale.setScalar(1 + 0.15 * Math.sin(now * 5)); ckRing.material.color.set(0xffc93c);
  }
  // 巧克力豆
  let n = 0;
  for (const c of S.chips) { if (n >= chipIM.instanceMatrix.count) break; _q.setFromEuler(_e.set(0, c.id * 1.3, 0)); _m.compose(_v.set(c.x, 0.08 + Math.max(0, Math.sin(now * 3 + c.id)) * 0.08, c.z), _q, _s.setScalar(2.1)); chipIM.setMatrixAt(n++, _m); }
  chipIM.count = n; chipIM.instanceMatrix.needsUpdate = true;
}

// ---------- 画面卡就自动降画质（先降清晰度，再关影子） ----------
const QL = IS_TOUCH ? [[1.5, 1], [1.15, 1], [1, 0], [0.75, 0]] : [[1.5, 1], [1.25, 1], [1, 1], [1, 0], [0.75, 0], [0.6, 0]];
let qLvl = 0, qT = 0, qN = 0, qBad = 0, fpsNow = 60;
function setQuality(l) {
  qLvl = clamp(l, 0, QL.length - 1); const [pr, sh] = QL[qLvl];
  renderer.setPixelRatio(Math.min(pr, devicePixelRatio || 1)); renderer.setSize(innerWidth, innerHeight, false);
  if (renderer.shadowMap.enabled !== !!sh) { renderer.shadowMap.enabled = !!sh; sun.castShadow = !!sh; scene.traverse(o => { if (o.material) [].concat(o.material).forEach(m => m.needsUpdate = true); }); }
}
function autoQuality(dt) {
  if (DEBUG) return;   // 调试/截图/录像时保持最高画质
  qT += dt; qN++;
  if (qT < 1) return;
  fpsNow = qN / qT; qT = 0; qN = 0;
  $('fpsTxt').textContent = Math.round(fpsNow) + ' FPS · Q' + (QL.length - qLvl);
  // 比屏幕该有的帧数低一截就降一档（很卡就一次降两档）；头 2 秒不算（刚打开在加载）
  if (performance.now() < 4000) return;
  if (fpsNow < 52) { if (++qBad >= 2 && qLvl < QL.length - 1) { qBad = 0; setQuality(qLvl + (fpsNow < 32 ? 2 : 1)); } } else qBad = 0;
}

// ---------- 主循环 ----------
let last = performance.now(), acc = 0, hitstop = 0, slowT = 0;
const STEP = 1 / 60;
let manualFrames = false, vNow = 0;
function frame(now) {
  if (!manualFrames) requestAnimationFrame(frame);
  let dt = Math.min(0.1, (now - last) / 1000); last = now;
  const rawDt = dt;
  const tsec = now / 1000;
  if (hitstop > 0) { hitstop -= dt; dt *= 0.05; }
  else if (slowT > 0) { slowT -= dt; dt *= 0.3; }
  if (!paused && !PF.adBusy && !inLobby) {
    // 每一帧都按实际时间走，屏幕刷新多快人就动多顺（帧太长就拆成几小步）
    const n = Math.max(1, Math.ceil(dt / (1 / 50))), h = dt / n;
    for (let i = 0; i < n && h > 0; i++) {
      readInput(S.players[ME]);
      SIM.thinkBots(S, h);
      SIM.step(S, h);
      handleEvents();
    }
    autoQuality(rawDt);
  } else dt = 0;
  updateActors(dt, tsec);
  stepPool(crumbs, dt, true); stepPool(stars, dt, false); stepPool(chipsFly, dt, false);
  updateCamera(Math.max(dt, 0.001));
  updateGuides(tsec); updateItems(tsec); updateWaves(dt); updateOcclusion(Math.max(dt, 0.016)); stepConfetti(dt);
  musHot = S.cookie.holder === ME; musicTick(!paused && !PF.adBusy);
  if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').hidden = true; }
  updateHUD();
  renderer.render(scene, camera);
  pvFrame(rawDt, tsec);
}

// ---------- 启动 ----------
(async () => {
  LANG = pickLang(); applyLang();
  await Promise.race([PF.init(), new Promise(r => setTimeout(r, 2500))]);
  if (PF.locale && !store.get('lang_set', 0)) { const l = PF.locale(); if (l && CODES.includes(l)) { LANG = l; applyLang(); } }
  newMatch();
  PF.loadingDone();
  requestAnimationFrame(t => { last = t; frame(t); });
  if (DEBUG) Object.assign(window, { __S: () => S, __SIM: SIM, __setLang: l => { LANG = l; applyLang(); }, __newMatch: newMatch, __cam: camera, __ME: () => ME, __renderer: renderer, __fast: sec => { for (let i = 0; i < sec * 60; i++) { readInput(S.players[ME]); SIM.thinkBots(S, STEP); SIM.step(S, STEP); handleEvents(); } }, __auto: () => { S.players[ME].bot = true; },
    // 录像用：停掉自动刷新，由外面一帧一帧推进（每帧固定毫秒数），画面就不受机器快慢影响
    __manual: () => { manualFrames = true; vNow = performance.now(); }, __step: ms => { vNow += ms; frame(vNow); } });
})();
// ===== CLIENT END =====

</script>
