:root{--ink:#4a2612;--cream:#fff6e6;--choc:#5a2e16;--gold:#f2b44a;--pink:#ff7fa8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#f3d9b6;font-family:'LC Display','Arial Rounded MT Bold','Nunito',system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
[hidden]{display:none!important}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 48%,rgba(0,0,0,0) 55%,rgba(120,70,30,.22) 100%)}
.out{color:#fff;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 4px 0 rgba(74,38,18,.35)}
#top{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;pointer-events:none;z-index:5}
.pill{background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:4px 14px 5px;font-size:20px;box-shadow:0 4px 0 rgba(74,38,18,.35);white-space:nowrap}
#aliveP b{color:#d0521b}
#feed{position:fixed;top:max(58px,calc(env(safe-area-inset-top) + 48px));right:12px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;pointer-events:none;z-index:5}
#feed div{background:rgba(255,246,230,.92);border:2px solid var(--ink);border-radius:10px;padding:2px 9px;font-size:14px;animation:fin .25s ease-out}
@keyframes fin{from{transform:translateX(30px);opacity:0}}
#banner{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);text-align:center;font-size:clamp(20px,3.2vw,32px);max-width:min(92vw,720px);pointer-events:none;z-index:6;line-height:1.15}
#banner.big{font-size:clamp(56px,10vw,110px)}
#banner.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.4);opacity:0}}
#tip{position:fixed;left:50%;bottom:max(18px,calc(env(safe-area-inset-bottom) + 12px));transform:translateX(-50%);background:var(--cream);border:3px solid var(--ink);border-radius:16px;padding:8px 16px 9px;font-size:clamp(15px,2vw,20px);max-width:min(90vw,640px);text-align:center;box-shadow:0 5px 0 rgba(74,38,18,.35);pointer-events:none;z-index:6;transition:opacity .3s}
#chipBox{position:fixed;left:14px;bottom:max(14px,calc(env(safe-area-inset-bottom) + 10px));display:flex;align-items:center;gap:8px;pointer-events:none;z-index:5}
#chipIco{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a8673d 0 12%,#4a2312 40%,#2c1308 75%);border:3px solid var(--ink);box-shadow:0 4px 0 rgba(74,38,18,.35);display:grid;place-items:center;font-size:22px;color:#fff}
#chipTxt{font-size:15px;line-height:1.1}
#pips{display:flex;gap:4px;margin-top:3px}
#pips i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:#f6e3c6}
#pips i.on{background:var(--gold)}
#keys{position:fixed;right:14px;bottom:14px;font-size:14px;text-align:right;line-height:1.5;pointer-events:none;z-index:5;opacity:.9}
#keys span{background:rgba(255,246,230,.85);border:2px solid var(--ink);border-radius:8px;padding:1px 8px}
.btn{font-family:inherit;border:3px solid var(--ink);border-radius:18px;background:var(--gold);color:var(--ink);font-size:22px;padding:10px 26px 12px;box-shadow:0 5px 0 var(--ink);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn.sec{background:var(--cream)}
#touch{position:fixed;inset:0;z-index:4;pointer-events:none}
#touch .tb{position:absolute;pointer-events:auto;border-radius:50%;border:4px solid var(--ink);display:grid;place-items:center;font-size:18px;color:#fff;box-shadow:0 5px 0 rgba(74,38,18,.45)}
#tbDash{width:96px;height:96px;right:max(22px,env(safe-area-inset-right));bottom:max(28px,calc(env(safe-area-inset-bottom) + 18px));background:radial-gradient(circle at 40% 30%,#ff9cbd,#ef4f86)}
#tbBite{width:70px;height:70px;right:calc(max(22px,env(safe-area-inset-right)) + 104px);bottom:max(40px,calc(env(safe-area-inset-bottom) + 30px));background:radial-gradient(circle at 40% 30%,#ffd57a,#e8962a)}
#touch .tb.cd{filter:grayscale(.6) brightness(.85)}
#touch .tb svg{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);transform:rotate(-90deg);pointer-events:none}
#stick{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:rgba(255,246,230,.35);border:3px solid rgba(74,38,18,.5);pointer-events:none}
#stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--cream);border:3px solid var(--ink)}
body.lefty #tbDash{right:auto;left:max(22px,env(safe-area-inset-left))}
body.lefty #tbBite{right:auto;left:calc(max(22px,env(safe-area-inset-left)) + 104px)}
body.lefty #chipBox{left:auto;right:14px}
#tags{position:fixed;inset:0;pointer-events:none;z-index:3}
#tags div{position:absolute;transform:translate(-50%,-100%);font-size:13px;white-space:nowrap;color:#fff;text-shadow:0 1px 0 var(--ink),1px 0 0 var(--ink),-1px 0 0 var(--ink),0 -1px 0 var(--ink)}
#tags div.me{font-size:17px;color:#ffe08a}
#tags div.me::after{content:'';display:block;margin:2px auto 0;width:0;height:0;border:7px solid transparent;border-top:9px solid #ffe08a;filter:drop-shadow(0 1px 0 var(--ink))}
#floats{position:fixed;inset:0;pointer-events:none;z-index:4}
#floats div{position:absolute;transform:translate(-50%,-50%);font-size:20px;white-space:nowrap;animation:fup .9s ease-out forwards}
@keyframes fup{0%{transform:translate(-50%,-30%) scale(.5);opacity:0}20%{transform:translate(-50%,-60%) scale(1.15);opacity:1}100%{transform:translate(-50%,-160%) scale(1);opacity:0}}
#panel{position:fixed;inset:0;display:grid;place-items:center;background:rgba(74,38,18,.25);z-index:10}
#card{background:var(--cream);border:4px solid var(--ink);border-radius:26px;padding:18px 22px 20px;width:min(92vw,430px);max-height:92vh;overflow:auto;box-shadow:0 8px 0 rgba(74,38,18,.4);text-align:center}
#card h2{margin:0 0 6px;font-size:34px;font-weight:normal}
#rank{margin:10px 0 14px;text-align:left;font-size:16px}
#rank div{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:10px}
#rank div.me{background:#ffe5a8}
#rank b{width:32px;font-weight:normal;color:#b0602a}
#rank s{text-decoration:none;margin-left:auto;font-size:13px;opacity:.75}
#rank .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
#reward{font-size:20px;color:#b0602a;margin-bottom:12px}
#gear{position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:var(--cream);font-size:22px;display:grid;place-items:center;z-index:7;cursor:pointer;box-shadow:0 4px 0 rgba(74,38,18,.35)}
#menu{position:fixed;inset:0;display:grid;place-items:center;background:rgba(74,38,18,.35);z-index:11}
#menu .card2{background:var(--cream);border:4px solid var(--ink);border-radius:24px;padding:16px 20px;width:min(90vw,340px);text-align:center;display:flex;flex-direction:column;gap:12px}
#menu select{font-family:inherit;font-size:18px;padding:6px;border:3px solid var(--ink);border-radius:12px;background:#fff}
#menu label{display:flex;justify-content:space-between;align-items:center;font-size:20px}
#menu input{width:24px;height:24px}

<body>
<canvas id="c"></canvas>
<div id="vig"></div>

<div id="chipBox"><div id="chipIco" class="out">0</div><div><div id="chipTxt" class="out"></div><div id="pips"><i></i><i></i><i></i><i></i></div></div></div>

<div id="menu" hidden><div class="card2"><h2 class="out" style="margin:0;font-weight:normal" data-t="paused"></h2><label><span data-t="sound"></span><input type="checkbox" id="optSound"></label><label><span data-t="lang"></span><select id="langSel"></select></label><button class="btn" id="bResume" data-t="resume"></button></div></div>

<script type="module">
const THREE = await import('./three.module.min.js').catch(() => import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'));
// ===== SIM START（纯逻辑，可在 node 里跑） =====
const SIM = (() => {
  const CFG = {
    R: 11,              // 饼干半径（米）
    SEED_GAP: 1.45,     // 碎块大小（泊松间距）
    TOP: 0.45,          // 饼干表面高度
    SPEED: 5.4,         // 基础跑速
    ACCEL: 14,
    KFRIC: 6,         // 被撞后滑行衰减
    BODY_R: 0.46,
    // 踩裂：每秒增加的裂纹（1 = 掉下去）
    CRACK_RUN: 0.045, CRACK_IDLE: 0.015,
    // 咬
    BITE_CD: 0.5, BITE_DMG: 0.26, BITE_REACH: 1.15, BITE_ROOT: 0.14,
    HIDDEN_CHIP: 0.28,  // 每块饼干里藏着巧克力豆的概率
    VISIBLE_CHIP: 0.22, // 表面能看到巧克力豆的概率
    // 冲撞
    DASH_T: 0.2, DASH_SPEED: 15, DASH_CD: 2.0, DASH_K: 7.5,
    // 体型（巧克力豆数量达到门槛升级）
    LVL_AT: [0, 2, 5, 9],
    SCALE: [1, 1.22, 1.45, 1.7],
    WEIGHT: [1, 1.45, 2.0, 2.7],   // 踩裂倍数（贪就会沉）
    POWER: [1, 1.3, 1.62, 1.95],   // 撞人力度
    MASS: [1, 1.25, 1.55, 1.9],    // 抗撞
    SLOW: [1, 0.96, 0.92, 0.88],
    SPREAD: 0.08,       // 一块掉下去，邻块裂纹 +
    FALL_T: 0.9,
    // 边缘自动塌
    ERODE_START: 25, ERODE_RATE: 0.1, ERODE_CRACK: 0.9,
    // 小鱼
    FISH_SPEED: 4.6, FISH_CD: 3.2, FISH_RANGE: 3.4, FISH_K: 8, FISH_JUMP_T: 0.5,
    COUNT_T: 3, MAX_T: 100,
  };

  function rng(seed) {
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }

  // ---- 饼干：圆内泊松点 + Voronoi 碎块 ----
  function makeCookie(seed) {
    const r = rng(seed), R = CFG.R, gap = CFG.SEED_GAP;
    const pts = [];
    // 外圈一圈，边缘碎块更整齐
    const nRim = Math.round(2 * Math.PI * (R - gap * 0.5) / gap);
    for (let i = 0; i < nRim; i++) { const a = (i + r() * 0.3) / nRim * Math.PI * 2; const d = R - gap * 0.5; pts.push([Math.cos(a) * d, Math.sin(a) * d]); }
    for (let tries = 0; tries < 6000; tries++) {
      const a = r() * Math.PI * 2, d = Math.sqrt(r()) * (R - gap * 1.1);
      const x = Math.cos(a) * d, z = Math.sin(a) * d;
      let ok = true;
      for (const p of pts) { const dx = p[0] - x, dz = p[1] - z; if (dx * dx + dz * dz < gap * gap) { ok = false; break; } }
      if (ok) pts.push([x, z]);
    }
    const CIRC = 72, circle = [];
    for (let i = 0; i < CIRC; i++) { const a = i / CIRC * Math.PI * 2; circle.push([Math.cos(a) * R, Math.sin(a) * R]); }
    const cells = pts.map((p, i) => {
      let poly = circle.slice();
      const cand = [];
      for (let j = 0; j < pts.length; j++) { if (j === i) continue; const dx = pts[j][0] - p[0], dz = pts[j][1] - p[1]; if (dx * dx + dz * dz < 16) cand.push(j); }
      for (const j of cand) {
        const q = pts[j], mx = (p[0] + q[0]) / 2, mz = (p[1] + q[1]) / 2, dx = q[0] - p[0], dz = q[1] - p[1];
        const side = v => (v[0] - mx) * dx + (v[1] - mz) * dz;
        const out = [];
        for (let k = 0; k < poly.length; k++) {
          const a = poly[k], b = poly[(k + 1) % poly.length], sa = side(a), sb = side(b);
          if (sa <= 0) out.push(a);
          if ((sa <= 0) !== (sb <= 0)) { const t = sa / (sa - sb); out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]); }
        }
        poly = out;
      }
      // 面积重心
      let A = 0, cx = 0, cz = 0;
      for (let k = 0; k < poly.length; k++) { const a = poly[k], b = poly[(k + 1) % poly.length], c = a[0] * b[1] - b[0] * a[1]; A += c; cx += (a[0] + b[0]) * c; cz += (a[1] + b[1]) * c; }
      A /= 2; cx /= 6 * A; cz /= 6 * A;
      return { id: i, x: p[0], z: p[1], cx, cz, poly, area: Math.abs(A), cand, nbrs: [], crack: 0, hp: 1, state: 0, fallT: 0, chip: false, hidden: false, chipPos: null, dist: Math.hypot(p[0], p[1]) };
    });
    // 邻居：两块共用一条边（多边形上至少两个点落在中垂线上）
    for (const c of cells) {
      for (const j of c.cand) {
        const q = cells[j]; const mx = (c.x + q.x) / 2, mz = (c.z + q.z) / 2, dx = q.x - c.x, dz = q.z - c.z, L = Math.hypot(dx, dz);
        let on = 0; for (const v of c.poly) if (Math.abs(((v[0] - mx) * dx + (v[1] - mz) * dz) / L) < 1e-4) on++;
        if (on >= 2) c.nbrs.push(j);
      }
      delete c.cand;
      c.hp = r() < 0.12 ? 0.2 + r() * 0.2 : 0.6 + r() * r() * 1.3 + r() * 0.3;
      if (r() < CFG.VISIBLE_CHIP && c.dist < CFG.R - 0.8) { c.chip = true; const a = r() * 6.283, d = r() * 0.35; c.chipPos = [c.cx + Math.cos(a) * d, c.cz + Math.sin(a) * d]; }
      else c.hidden = r() < CFG.HIDDEN_CHIP;
    }
    // 查格子用的网格
    const G = 2, N = Math.ceil(2 * (R + 2) / G), grid = Array.from({ length: N * N }, () => []);
    for (const c of cells) {
      const gx = Math.floor((c.x + R + 2) / G), gz = Math.floor((c.z + R + 2) / G);
      for (let ox = -2; ox <= 2; ox++) for (let oz = -2; oz <= 2; oz++) { const X = gx + ox, Z = gz + oz; if (X >= 0 && Z >= 0 && X < N && Z < N) grid[Z * N + X].push(c.id); }
    }
    return { cells, grid, G, N, R };
  }

  function cellAt(ck, x, z) {
    if (x * x + z * z > ck.R * ck.R) return null;
    const gx = Math.floor((x + ck.R + 2) / ck.G), gz = Math.floor((z + ck.R + 2) / ck.G);
    if (gx < 0 || gz < 0 || gx >= ck.N || gz >= ck.N) return null;
    let best = null, bd = 1e9;
    for (const id of ck.grid[gz * ck.N + gx]) { const c = ck.cells[id], dx = c.x - x, dz = c.z - z, d = dx * dx + dz * dz; if (d < bd) { bd = d; best = c; } }
    return best;
  }
  const solid = c => c && c.state === 0;
  const standable = c => c && (c.state === 0 || (c.state === 1 && c.fallT < 0.4));

  const SNACKS = ['macaron', 'donut', 'pudding', 'cupcake', 'macaron', 'donut', 'pudding', 'cupcake', 'macaron'];

  function create(opts = {}) {
    const seed = opts.seed ?? ((Math.random() * 1e9) | 0);
    const n = opts.players ?? 9;
    const ck = makeCookie(seed);
    const R = rng(seed ^ 0x5bd1e995);
    const players = [];
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2 + 0.3, d = CFG.R * 0.62;
      players.push({
        id: i, bot: true, name: '', snack: SNACKS[i % SNACKS.length], look: i, x: Math.cos(a) * d, z: Math.sin(a) * d, face: a + Math.PI,
        mvx: 0, mvz: 0, kvx: 0, kvz: 0, chips: 0, lvl: 0, alive: true, place: 0, fallT: -1,
        biteCd: 0, biteT: 0, rootT: 0, dashCd: 0.5, dashT: 0, dashX: 0, dashZ: 0, hitT: 0, lastHit: -1, lastHitT: 0,
        fish: null, moving: false, kills: 0, bites: 0, bumps: 0, gentle: 0,
        inp: { mx: 0, mz: 0, bite: false, dash: false }, ai: { t: 0, mx: 0, mz: 0, tgt: -1 },
      });
    }
    const S = { cfg: CFG, ck, players, t: 0, phase: 'count', phaseT: CFG.COUNT_T, events: [], alive: n, order: [], winner: -1, erodeR: CFG.R + 1, rnd: R, tutorial: !!opts.tutorial, seed };
    return S;
  }

  function lvlOf(chips) { let l = 0; for (let i = 0; i < CFG.LVL_AT.length; i++) if (chips >= CFG.LVL_AT[i]) l = i; return l; }
  function ev(S, e) { S.events.push(e); }

  function addCrack(S, c, v, by) {
    if (!c || c.state !== 0) return;
    c.crack += v;
    if (by != null) c.by = by;
  }

  function eliminate(S, p) {
    p.alive = false; p.fallT = 0; p.place = S.alive; S.alive--; S.order.push(p.id);
    p.fish = { x: p.x, z: p.z, cd: 1.2, jumpT: -1, jx: 0, jz: 0, tx: 0, tz: 0, ox: 0, oz: 0, hit: false, face: p.face, vx: 0, vz: 0 };
    const killer = (p.lastHit >= 0 && S.t - p.lastHitT < 3) ? p.lastHit : -1;
    if (killer >= 0) S.players[killer].kills++;
    ev(S, { k: 'fall', p: p.id, by: killer, x: p.x, z: p.z });
  }

  function step(S, dt) {
    const C = CFG, ck = S.ck, P = S.players;
    S.events.length = 0;
    S.t += dt;
    if (S.phase === 'count') { S.phaseT -= dt; if (S.phaseT <= 0) { S.phase = 'play'; S.playT = 0; ev(S, { k: 'go' }); } }
    const playing = S.phase === 'play';
    if (playing) S.playT += dt;
    if (S.phase === 'end') S.phaseT += dt;

    // --- 玩家 ---
    for (const p of P) {
      p.biteCd -= dt; p.dashCd -= dt; p.rootT -= dt; p.hitT -= dt; p.biteT -= dt;
      if (!p.alive) { stepFish(S, p, dt); continue; }
      const sc = C.SCALE[p.lvl];
      let mx = playing ? p.inp.mx : 0, mz = playing ? p.inp.mz : 0;
      const ml = Math.hypot(mx, mz); if (ml > 1) { mx /= ml; mz /= ml; }
      if (p.rootT > 0) { mx *= 0.15; mz *= 0.15; }
      const sp = C.SPEED * C.SLOW[p.lvl];
      const a = 1 - Math.exp(-C.ACCEL * dt);
      p.mvx += (mx * sp - p.mvx) * a; p.mvz += (mz * sp - p.mvz) * a;
      if (ml > 0.15) { const tf = Math.atan2(mx, mz); let d = tf - p.face; d = Math.atan2(Math.sin(d), Math.cos(d)); p.face += d * Math.min(1, dt * 16); }
      p.moving = ml > 0.15;
      // 冲撞
      if (playing && p.inp.dash && p.dashCd <= 0) {
        p.dashCd = C.DASH_CD; p.dashT = C.DASH_T;
        let dx = mx, dz = mz; if (Math.hypot(dx, dz) < 0.2) { dx = Math.sin(p.face); dz = Math.cos(p.face); }
        const l = Math.hypot(dx, dz); p.dashX = dx / l; p.dashZ = dz / l; p.face = Math.atan2(p.dashX, p.dashZ);
        ev(S, { k: 'dash', p: p.id });
      }
      p.inp.dash = false;
      // 咬
      if (playing && p.inp.bite && p.biteCd <= 0) {
        p.biteCd = C.BITE_CD; p.rootT = C.BITE_ROOT; p.biteT = 0.25; p.bites++;
        const reach = C.BITE_REACH * sc;
        const bx = p.x + Math.sin(p.face) * reach, bz = p.z + Math.cos(p.face) * reach;
        let c = cellAt(ck, bx, bz); if (!solid(c)) c = cellAt(ck, p.x, p.z);
        if (solid(c)) {
          addCrack(S, c, C.BITE_DMG * (S.tutorial && !p.bot ? 0.6 : 1), p.id);
          let got = false;
          if (c.chip) { c.chip = false; got = true; }
          else if (c.hidden) { c.hidden = false; got = true; }
          ev(S, { k: 'bite', p: p.id, c: c.id, x: bx, z: bz, chip: got });
          if (got) {
            p.chips++; const nl = lvlOf(p.chips);
            if (nl > p.lvl) { p.lvl = nl; ev(S, { k: 'grow', p: p.id, lvl: nl }); }
          }
        }
      }
      p.inp.bite = false;
      let vx = p.mvx + p.kvx, vz = p.mvz + p.kvz;
      if (p.dashT > 0) { p.dashT -= dt; vx = p.dashX * C.DASH_SPEED + p.kvx * 0.3; vz = p.dashZ * C.DASH_SPEED + p.kvz * 0.3; }
      p.x += vx * dt; p.z += vz * dt;
      const kf = Math.exp(-C.KFRIC * dt); p.kvx *= kf; p.kvz *= kf;
      // 脚下踩裂
      const under = cellAt(ck, p.x, p.z);
      if (playing && solid(under)) {
        const sp2 = Math.hypot(vx, vz);
        const rate = (sp2 > 1 ? C.CRACK_RUN : C.CRACK_IDLE) * C.WEIGHT[p.lvl] * (S.tutorial && !p.bot && S.playT < 20 ? 0.4 : 1);
        addCrack(S, under, rate * dt, p.id);
      }
      // 掉下去（冲撞时腾空，能越过小缝，落地才算）
      if (p.dashT <= 0 && !standable(under) && S.phase !== 'count') eliminate(S, p);
    }

    // --- 碰撞 ---
    for (let i = 0; i < P.length; i++) {
      const a = P[i]; if (!a.alive) continue;
      for (let j = i + 1; j < P.length; j++) {
        const b = P[j]; if (!b.alive) continue;
        const ra = C.BODY_R * C.SCALE[a.lvl], rb = C.BODY_R * C.SCALE[b.lvl];
        let dx = b.x - a.x, dz = b.z - a.z, d = Math.hypot(dx, dz);
        if (d >= ra + rb || d < 1e-6) continue;
        dx /= d; dz /= d;
        const ma = C.MASS[a.lvl], mb = C.MASS[b.lvl], ov = ra + rb - d;
        a.x -= dx * ov * mb / (ma + mb); a.z -= dz * ov * mb / (ma + mb);
        b.x += dx * ov * ma / (ma + mb); b.z += dz * ov * ma / (ma + mb);
        const ad = a.dashT > 0, bd = b.dashT > 0;
        if (ad || bd) {
          let fa = 0, fb = 0; // a 被推 / b 被推 力度
          if (ad && bd) { fa = C.DASH_K * 0.8 * C.POWER[b.lvl] / ma; fb = C.DASH_K * 0.8 * C.POWER[a.lvl] / mb; }
          else if (ad) { fb = C.DASH_K * C.POWER[a.lvl] / mb; fa = 2.5 / ma; }
          else { fa = C.DASH_K * C.POWER[b.lvl] / ma; fb = 2.5 / mb; }
          b.kvx += dx * fb; b.kvz += dz * fb; a.kvx -= dx * fa; a.kvz -= dz * fa;
          a.dashT = 0; b.dashT = 0; a.hitT = 0.3; b.hitT = 0.3;
          if (ad) { b.lastHit = a.id; b.lastHitT = S.t; a.bumps++; }
          if (bd) { a.lastHit = b.id; a.lastHitT = S.t; b.bumps++; }
          ev(S, { k: 'bonk', a: a.id, b: b.id, x: (a.x + b.x) / 2, z: (a.z + b.z) / 2, f: Math.max(fa, fb) });
        } else {
          // 普通挤：轻微推开
          const push = 1.2 * dt * 60 * 0.05;
          b.kvx += dx * push * C.MASS[a.lvl] / mb; b.kvz += dz * push * C.MASS[a.lvl] / mb;
          a.kvx -= dx * push * C.MASS[b.lvl] / ma; a.kvz -= dz * push * C.MASS[b.lvl] / ma;
        }
      }
    }

    // --- 饼干 ---
    if (playing && S.playT > C.ERODE_START) S.erodeR = C.R - (S.playT - C.ERODE_START) * C.ERODE_RATE;
    for (const c of ck.cells) {
      if (c.state === 0) {
        if (playing && c.dist > S.erodeR) c.crack += C.ERODE_CRACK * dt;
        if (c.crack >= c.hp) {
          c.state = 1; c.fallT = 0;
          for (const j of c.nbrs) addCrack(S, ck.cells[j], C.SPREAD);
          ev(S, { k: 'break', c: c.id, x: c.cx, z: c.cz });
        }
      } else if (c.state === 1) {
        c.fallT += dt; if (c.fallT >= C.FALL_T) { c.state = 2; ev(S, { k: 'sink', c: c.id, x: c.cx, z: c.cz }); }
      }
    }

    // --- 结束 ---
    if (playing && (S.alive <= 1 || S.playT > C.MAX_T)) {
      S.phase = 'end'; S.phaseT = 0;
      let w = P.find(p => p.alive);
      if (!w) { // 同时掉：最后掉下去的那个算赢
        w = P[S.order[S.order.length - 1]];
      }
      S.winner = w.id;
      // 名次
      const alive = P.filter(p => p.alive && p !== w).sort((a, b) => b.chips - a.chips);
      w.place = 1; let k = 2; for (const p of alive) p.place = k++;
      if (!w.alive) { // 赢家其实也掉了，把他从名次里拿掉重排
        const rest = S.order.filter(id => id !== w.id).reverse();
        for (const id of rest) P[id].place = k++;
      }
      ev(S, { k: 'end', w: w.id });
    }
  }

  function stepFish(S, p, dt) {
    const C = CFG, f = p.fish; if (!f) return;
    if (p.fallT >= 0) { p.fallT += dt; if (p.fallT < 0.8) return; }
    f.cd -= dt;
    if (f.jumpT >= 0) {
      f.jumpT += dt;
      const t = Math.min(1, f.jumpT / C.FISH_JUMP_T);
      f.x = f.ox + (f.tx - f.ox) * t; f.z = f.oz + (f.tz - f.oz) * t;
      if (!f.hit && t > 0.75) {
        f.hit = true;
        for (const q of S.players) {
          if (!q.alive) continue;
          const dx = q.x - f.x, dz = q.z - f.z, d = Math.hypot(dx, dz);
          if (d < 1.0 * C.SCALE[q.lvl]) {
            let ux = f.jx, uz = f.jz; const l = Math.hypot(ux, uz) || 1;
            const k = C.FISH_K / C.MASS[q.lvl];
            q.kvx += ux / l * k; q.kvz += uz / l * k; q.hitT = 0.3; q.lastHit = p.id; q.lastHitT = S.t;
            ev(S, { k: 'fishhit', p: p.id, q: q.id, x: q.x, z: q.z });
          }
        }
      }
      if (f.jumpT >= C.FISH_JUMP_T + 0.35) { f.jumpT = -1; f.x = f.ox; f.z = f.oz; }
      return;
    }
    let mx = p.inp.mx, mz = p.inp.mz; const ml = Math.hypot(mx, mz); if (ml > 1) { mx /= ml; mz /= ml; }
    const a = 1 - Math.exp(-8 * dt);
    f.vx += (mx * C.FISH_SPEED - f.vx) * a; f.vz += (mz * C.FISH_SPEED - f.vz) * a;
    let nx = f.x + f.vx * dt, nz = f.z + f.vz * dt;

    const near = (x, z) => Math.hypot(x - (me.alive ? me.x : me.fish ? me.fish.x : 0), z - (me.alive ? me.z : me.fish ? me.fish.z : 0)) < 7;
    switch (e.k) {
      case 'go': banner(tl('go'), true, 0.9); SFX.beep(true); break;
      case 'bite': {
        const p = S.players[e.p], a = actors[e.p]; a.biteAnim = 0.25;
        crumbBurst(e.x, topH(e.x, e.z) + 0.05, e.z, e.p === ME ? 10 : 5, 1.6);
        SFX.bite(e.p === ME || near(e.x, e.z));
        if (e.chip) {
          const fc = emit(chipsFly, e.x, topH(e.x, e.z) + 0.1, e.z, (p.x - e.x) * 2.5, 5, (p.z - e.z) * 2.5, 0.42, 1, 1.2);
          if (e.p === ME) { SFX.chip(); float(p.x, 1.4, p.z, '+1 🍫', '#ffe08a'); }
        }
        break;
      }
      case 'grow': { const p = S.players[e.p]; actors[e.p].pop = 0.4; for (let i = 0; i < 14; i++) { const a = i / 14 * 6.283; emit(stars, p.x, 0.9, p.z, Math.cos(a) * 3, 2, Math.sin(a) * 3, 0.6, 1, 0.3); } if (e.p === ME) { SFX.grow(); if (tut.on && tut.step < 4) { } } break; }
      case 'dash': { SFX.dash(e.p === ME); actors[e.p].dashFx = 0.25; break; }
      case 'bonk': {
        SFX.bonk(e.f); if (e.a === ME || e.b === ME) camShake = 0.25;
        for (let i = 0; i < 10; i++) { const a = Math.random() * 6.283; emit(stars, e.x, 0.9, e.z, Math.cos(a) * 4, 1 + Math.random() * 3, Math.sin(a) * 4, 0.45, 1, 0.5); }
        actors[e.a].flash = actors[e.b].flash = 0.15;
        break;
      }
      case 'break': { const n = near(e.x, e.z); SFX.crack(n); crumbBurst(e.x, C.TOP, e.z, n ? 18 : 8, 1.4); break; }
      case 'sink': { splash(e.x, e.z, 0.8); if (near(e.x, e.z)) SFX.splash(0.6); break; }
      case 'fall': {
        const p = S.players[e.p]; actors[e.p].fallFrom = { x: p.x, z: p.z, y: topH(p.x, p.z) };
        SFX.fall(); setTimeout(() => { splash(p.x, p.z, 1.5); SFX.splash(1); }, 380);
        if (e.by >= 0) feedMsg(tl('pushed', { a: nameOf(e.p), b: nameOf(e.by) })); else feedMsg(tl('fell', { a: nameOf(e.p) }));
        if (e.p === ME) { camShake = 0.35; setTimeout(() => { if (S.phase === 'play') { banner('🐟 ' + tl('splash'), false, 1.4); tip(tl(touchMode ? 'fishTipT' : 'fishTip')); setTimeout(() => { if (tipTxt === tl(touchMode ? 'fishTipT' : 'fishTip')) tip(''); }, 6000); } }, 700); }
        else if (e.by === ME) { float(p.x, 1.2, p.z, '💥', '#fff'); }
        break;
      }
      case 'fishjump': SFX.fish(); splash(e.x, e.z, 0.5); break;
      case 'fishhit': { SFX.bonk(6); feedMsg(tl('fishHit', { a: nameOf(e.q), b: nameOf(e.p) })); for (let i = 0; i < 8; i++) { const a = Math.random() * 6.283; emit(drops, e.x, 0.8, e.z, Math.cos(a) * 3, 2, Math.sin(a) * 3, 0.8, 0.8); } if (e.q === ME) camShake = 0.25; break; }
      case 'end': showEnd(); break;
    }
  }
  if (S.phase === 'count') { const n = Math.ceil(S.phaseT); if (n < lastBeep && n > 0) { lastBeep = n; banner(String(n), true, 0.8); SFX.beep(false); } }
  if (!edgeWarned && S.phase === 'play' && S.playT > C.ERODE_START) { edgeWarned = true; banner(tl('edge'), false, 2.2); }
}

function showEnd() {
  PF.setPlaying(false);
  const me = S.players[ME], won = S.winner === ME;
  setTimeout(() => {
    if (won) { SFX.win(); PF.happy(); } else SFX.lose();
    banner(won ? tl('win') : tl('winner', { a: S.players[S.winner].bot ? S.players[S.winner].name : tl('you') }), true, 2.2);
  }, 200);
  const crumbsN = 10 + (10 - me.place) * 5 + me.chips * 2 + me.kills * 5;
  store.set('crumbs', store.get('crumbs', 0) + crumbsN);
  store.set('played', store.get('played', 0) + 1);
  if (won) store.set('wins', store.get('wins', 0) + 1);
  setTimeout(() => {
    endShown = true;
    $('resT').textContent = won ? tl('win') : tl('place', { n: me.place });
    $('reward').textContent = '🍪 ' + tl('crumbs', { n: crumbsN });
    const rows = S.players.slice().sort((a, b) => a.place - b.place).map(p => `<div class="${p.id === ME ? 'me' : ''}"><b>${p.place === 1 ? '👑' : '#' + p.place}</b><i class="dot" style="background:${DOT_COL[p.look % 9]}"></i>${esc(p.bot ? p.name : tl('you'))}<s>🍫${p.chips} · 💥${p.kills}</s></div>`);
    $('rank').innerHTML = rows.join('');
    $('panel').hidden = false; $('banner').hidden = true; bannerT = 0;
    tip('');
  }, 2300);
}
$('bAgain').addEventListener('click', () => {
  ensureAudio();
  $('panel').hidden = true;
  // 广告只在两局之间
  PF.midgame(() => newMatch());
});

// ---------- 菜单 ----------
const ls = $('langSel'); for (const c of CODES) { const o = document.createElement('option'); o.value = c; o.textContent = LANG_NAMES[c]; ls.appendChild(o); }
ls.addEventListener('change', () => { LANG = ls.value; store.set('lang_set', 1); try { localStorage.setItem('lc_lang', LANG); } catch (e) { } applyLang(); if (S) buildTags(); });
function buildTags() { S.players.forEach((p, i) => actors[i].tag.textContent = p.bot ? p.name : tl('you')); }
$('optSound').checked = soundOn; $('optSound').addEventListener('change', e => { soundOn = e.target.checked; store.set('sound', soundOn); });
let paused = false;
function toggleMenu(force) { const show = force ?? $('menu').hidden; $('menu').hidden = !show; paused = show; ls.value = LANG; PF.setPlaying(!show && S && S.phase !== 'end'); }
$('gear').addEventListener('click', () => toggleMenu());
$('bResume').addEventListener('click', () => toggleMenu(false));
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (S && S.phase === 'play' && !paused) toggleMenu(true); if (AC) AC.suspend(); } else if (AC && !PF.muted) AC.resume(); });

// ---------- 每帧画角色 ----------
function updateActors(dt, now) {
  for (let i = 0; i < S.players.length; i++) {
    const p = S.players[i], a = actors[i], sn = a.sn;
    const target = C.SCALE[p.lvl];
    a.pop = Math.max(0, (a.pop || 0) - dt);
    a.scale = lerp(a.scale, target, 1 - Math.exp(-8 * dt));
    const popS = a.pop > 0 ? 1 + Math.sin((0.4 - a.pop) / 0.4 * Math.PI) * 0.25 : 1;
    if (p.alive) {
      a.root.visible = true; a.fish.g.visible = false;
      const sp = Math.hypot(p.mvx, p.mvz);
      a.hop += dt * (sp > 0.6 ? 15 : 0);
      const hopY = sp > 0.6 ? Math.abs(Math.sin(a.hop)) * 0.12 : 0;
      const sq = sp > 0.6 ? Math.cos(a.hop * 2) * 0.06 : Math.sin(now * 3 + i) * 0.02;
      let y = topH(clamp(p.x, -R, R), clamp(p.z, -R, R));
      const c = SIM.cellAt(S.ck, p.x, p.z); if (c && cellObjs[c.id]) y += cellObjs[c.id].grp.position.y;
      if (p.dashT > 0) y += Math.sin((1 - p.dashT / C.DASH_T) * Math.PI) * 0.35;
      a.root.position.set(p.x, y, p.z);
      a.root.rotation.y = p.face;
      const s = a.scale * popS * VIS;
      a.root.scale.set(s * (1 - sq * 0.5), s * (1 + sq), s * (1 - sq * 0.5));
      sn.body.position.y = hopY;
      a.biteAnim = Math.max(0, (a.biteAnim || 0) - dt);
      const bt = a.biteAnim > 0 ? Math.sin(a.biteAnim / 0.25 * Math.PI) : 0;
      sn.body.rotation.x = bt * 0.5 + (p.dashT > 0 ? 0.25 : 0) + (p.hitT > 0 ? -0.3 : 0);
      sn.face.mouth.visible = bt < 0.2; sn.face.mOpen.visible = bt >= 0.2;
      a.flash = Math.max(0, a.flash - dt);
      // 冲撞拖尾
      if (p.dashT > 0 && Math.random() < 0.7) emit(crumbs, p.x, y + 0.1, p.z, -Math.sin(p.face) * 1.5 + (Math.random() - 0.5), 1.5, -Math.cos(p.face) * 1.5 + (Math.random() - 0.5), 0.5, 0.8);
      // 走路掉渣
      if (sp > 2 && Math.random() < dt * 6 * C.WEIGHT[p.lvl]) emit(crumbs, p.x, y + 0.05, p.z, (Math.random() - 0.5), 1 + Math.random(), (Math.random() - 0.5), 0.6, 0.5);
      sn.blob.material.opacity = 0.22;
    } else {
      // 掉下去：先往下翻滚，再变成小鱼
      const ft = p.fallT, ff = a.fallFrom || { x: p.x, z: p.z, y: C.TOP };
      if (ft < 0.8) {
        a.root.visible = true; a.fish.g.visible = false;
        a.root.position.set(ff.x + Math.sin(p.face) * ft * 0.8, ff.y - ft * ft * 4.5, ff.z + Math.cos(p.face) * ft * 0.8);
        a.root.rotation.x = ft * 3; sn.blob.material.opacity = 0;
      } else {
        a.root.visible = false;
        const f = p.fish; a.fish.g.visible = !!f;
        if (f) {
          let y = -0.05 + Math.sin(now * 4 + i) * 0.05, rx = 0;
          if (f.jumpT >= 0) { const t = Math.min(1, f.jumpT / C.FISH_JUMP_T); y = Math.sin(Math.min(1, f.jumpT / (C.FISH_JUMP_T + 0.35)) * Math.PI) * 1.8; rx = -0.8 + t * 1.6; }
          a.fish.g.position.set(f.x, y, f.z); a.fish.g.rotation.set(rx, f.face, 0);
          a.fish.tail.rotation.y = Math.sin(now * 12 + i) * 0.5;
          const fs = (0.9 + 0.1 * a.scale) * VIS; a.fish.g.scale.setScalar(fs);
          if (Math.random() < dt * 3) ripple(f.x, f.z, 0.35, 0.6);
        }
      }
    }
    // 名字
    const tag = a.tag;
    let tx, ty, tz;
    if (p.alive || p.fallT < 0.8) { tx = a.root.position.x; ty = a.root.position.y + 1.05 * a.scale * VIS; tz = a.root.position.z; }
    else if (p.fish) { tx = p.fish.x; ty = 0.7; tz = p.fish.z; }
    const [sx, sy, vis] = toScreen(tx, ty, tz);
    tag.style.display = vis && (i === ME || p.alive) ? '' : 'none';
    tag.style.left = sx + 'px'; tag.style.top = sy + 'px';
    tag.style.opacity = p.alive ? 1 : 0.6;
  }
}
function updateRings(dt) {
  for (const r of rings) { if (!r.m.visible) continue; r.t += dt; const k = r.t / r.max; if (k >= 1) { r.m.visible = false; continue; } r.m.scale.setScalar(r.s * (0.3 + k * 1.6)); r.m.material.opacity = (1 - k) * 0.7; }
}

// ---------- 主循环 ----------
let last = performance.now(), acc = 0;
const STEP = 1 / 60;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.1, (now - last) / 1000); last = now;
  const tsec = now / 1000;
  if (!paused && !PF.adBusy) {
    acc += dt;
    let n = 0;
    while (acc >= STEP && n < 6) {
      acc -= STEP; n++;
      readInput(S.players[ME]);
      SIM.thinkBots(S, STEP);
      SIM.step(S, STEP);
      handleEvents();
    }
    tut.update(dt);
  } else dt = 0;
  milkU.uTime.value = tsec;
  updateCookie(tsec);
  updateActors(dt, tsec);
  stepPool(crumbs, dt, true); stepPool(drops, dt, false); stepPool(stars, dt, false); stepPool(chipsFly, dt, false);
  updateRings(dt);
  updateCamera(Math.max(dt, 0.001));
  if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').hidden = true; }
  updateHUD();
  renderer.render(scene, camera);
}

// ---------- 启动 ----------
(async () => {
  LANG = pickLang(); applyLang();
  await Promise.race([PF.init(), new Promise(r => setTimeout(r, 2500))]);
  if (PF.locale && !store.get('lang_set', 0)) { const l = PF.locale(); if (l && CODES.includes(l)) { LANG = l; applyLang(); } }
  newMatch();
  PF.loadingDone();
  requestAnimationFrame(t => { last = t; frame(t); });
  if (DEBUG) Object.assign(window, { __S: () => S, __SIM: SIM, __setLang: l => { LANG = l; applyLang(); }, __newMatch: newMatch, __cam: camera, __ME: () => ME, __tut: tut, __renderer: renderer, __fast: sec => { for (let i = 0; i < sec * 60; i++) { readInput(S.players[ME]); SIM.thinkBots(S, STEP); SIM.step(S, STEP); handleEvents(); } }, __auto: () => { S.players[ME].bot = true; } });
})();
// ===== CLIENT END =====

</script>
